name: Prepare country dataset dependency lockfile

on:
  push:
    branches: [web-app]
    paths:
      - .github/workflows/prepare-country-dependency.yml

permissions:
  contents: write

jobs:
  prepare:
    if: contains(github.event.head_commit.message, 'Prepare country package lock')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock dependency (exact reproducible version)
        run: |
          npm --prefix web install --package-lock-only --save-exact world-countries@5.1.0
          npm --prefix web ci
      - name: Preserve npm package and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m 'Lock world-countries geography dataset dependency'
          git push origin HEAD:web-app
