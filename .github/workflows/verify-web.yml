name: Verify and publish website

on:
  push:
    branches: [web-app]
  pull_request:
    branches: [web-app]

permissions:
  contents: write

concurrency:
  group: jobsearcher-web-source
  cancel-in-progress: false

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Publish validated web build to github-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/web-app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_dir="$(mktemp -d)"
          trap 'rm -rf "${deployment_dir}"' EXIT
          git clone --quiet --branch github-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${deployment_dir}"
          # Preserve branch documentation and the deployment branch itself.
          rsync -a --delete --exclude '.git/' --exclude 'README.md' \
            web/dist/ "${deployment_dir}/"
          touch "${deployment_dir}/.nojekyll"
          git -C "${deployment_dir}" add -A
          if git -C "${deployment_dir}" diff --cached --quiet; then
            echo 'GitHub Pages already matches validated web source.'
            exit 0
          fi
          git -C "${deployment_dir}" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Deploy validated JobSearcher website"
          git -C "${deployment_dir}" push origin github-pages
