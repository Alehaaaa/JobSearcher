name: One-time JobUI source history import

on:
  push:
    branches: [github-pages]
    paths:
      - ".github/workflows/import-jobui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'One-time JobUI branch import')
    runs-on: ubuntu-latest
    steps:
      - name: Import all original branches and tags, preserving the published website
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir source-import
          cd source-import
          git init --quiet
          git remote add old https://github.com/Alehaaaa/JobUI.git
          # Fetch full ancestry and tags, not a depth-limited checkout.
          git -c protocol.version=2 fetch --tags old '+refs/heads/*:refs/remotes/old/*'
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mapfile -t originals < <(git for-each-ref --format='%(refname:short)' refs/remotes/old)
          if [ "${#originals[@]}" -ne 3 ]; then
            printf 'Unexpected source branch count: %s\n' "${#originals[@]}" >&2
            exit 1
          fi
          refspecs=()
          for original in "${originals[@]}"; do
            branch="${original#old/}"
            # JobSearcher/github-pages MUST remain the existing public site.
            if [ "$branch" = github-pages ]; then branch=web-app; fi
            if git ls-remote --exit-code destination "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing destination branch $branch" >&2
              exit 1
            fi
            refspecs+=("refs/remotes/$original:refs/heads/$branch")
          done
          while IFS= read -r tag; do
            if git ls-remote --exit-code destination "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing destination tag $tag" >&2
              exit 1
            fi
            refspecs+=("refs/tags/$tag:refs/tags/$tag")
          done < <(git for-each-ref --format='%(refname:strip=2)' refs/tags)
          printf 'Transferring %s refs with complete history:\n' "${#refspecs[@]}"
          printf '  %s\n' "${refspecs[@]}"
          # Atomic: branch/tag import either all succeeds or no refs are moved.
          git push --atomic destination "${refspecs[@]}"
          echo "Source branches imported. Pages branch retained."
          git ls-remote destination 'refs/heads/*'
